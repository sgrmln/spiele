name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

- name: Inject Supabase credentials
        run: |
          sed -i "s|\${{ secrets.SUPABASE_URL }}|${{ secrets.SUPABASE_URL }}|g" index.html
          sed -i "s|\${{ secrets.SUPABASE_ANON_KEY }}|${{ secrets.SUPABASE_ANON_KEY }}|g" index.html

      - name: Verify config.js
        run: cat config.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: ''
