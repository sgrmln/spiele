<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dieters Boardgames</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#f5f0e8;--cream2:#ede7d9;--ink:#1a1510;--ink2:#3d3228;
  --amber:#c8893a;--amber2:#e8b96a;
  --g100:#f0ebe2;--g200:#e0d9cc;--g300:#c8bfb0;--g400:#9a8f80;--g500:#6b5f52;
  --green:#2d5a3d;--green2:#4a8f63;--red:#8b2a2a;--blue:#2a4a7a;
  --r:8px;--r2:5px;
}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);font-size:14px;line-height:1.5}
header{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:16px;padding:0 24px;height:58px;background:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.header-brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand-icon{font-size:22px;color:var(--amber2)}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.brand-title{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:#fff}
.brand-sub{font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--amber2)}
.search-wrap{flex:1;max-width:480px;margin:0 auto;position:relative}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.4);pointer-events:none}
.search-wrap input{width:100%;padding:8px 12px 8px 32px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:var(--r2);color:#fff;font-family:inherit;font-size:13px;outline:none}
.search-wrap input::placeholder{color:rgba(255,255,255,.35)}
.search-wrap input:focus{border-color:var(--amber2)}
.header-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.stat-pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.7);font-size:12px;padding:3px 10px;border-radius:20px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border:1px solid var(--g300);border-radius:var(--r2);background:#fff;color:var(--ink2);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:all .13s;white-space:nowrap}
.btn:hover{background:var(--cream2)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#fff}
.btn.primary:hover{background:#b07830}
.btn.danger{background:#fff5f5;border-color:#fca5a5;color:var(--red)}
.layout{display:flex;height:calc(100vh - 58px);overflow:hidden}
.sidebar{width:200px;flex-shrink:0;background:#fff;border-right:1px solid var(--g200);overflow-y:auto;padding:14px 10px}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:var(--g200)}
.sidebar-section{margin-bottom:18px}
.sidebar-section h4{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--g400);padding:0 6px;margin-bottom:5px}
.filter-group{display:flex;flex-direction:column;gap:1px}
.filter-btn{display:flex;align-items:center;justify-content:space-between;padding:5px 7px;border:none;border-radius:var(--r2);background:transparent;color:var(--ink2);font-family:inherit;font-size:12.5px;cursor:pointer;text-align:left;transition:background .1s}
.filter-btn:hover{background:var(--g100)}
.filter-btn.active{background:var(--ink);color:#fff;font-weight:500}
.filter-btn .count{font-size:11px;background:var(--g100);color:var(--g400);padding:1px 6px;border-radius:10px}
.filter-btn.active .count{background:rgba(255,255,255,.2);color:rgba(255,255,255,.8)}
.main{flex:1;overflow-y:auto;padding:18px 22px}
.main::-webkit-scrollbar{width:4px}
.main::-webkit-scrollbar-thumb{background:var(--g200);border-radius:2px}
.view-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--g200)}
.view-label{flex:1;font-size:13px;color:var(--g500);font-weight:500}
.sort-select{padding:6px 10px;border:1px solid var(--g200);border-radius:var(--r2);background:#fff;font-family:inherit;font-size:13px;outline:none;cursor:pointer}
.view-tabs{display:flex;gap:3px;background:var(--g100);padding:3px;border-radius:var(--r2)}
.view-tab{display:flex;align-items:center;gap:4px;padding:5px 10px;border:none;border-radius:calc(var(--r2) - 1px);background:transparent;color:var(--g500);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:all .13s}
.view-tab:hover{color:var(--ink)}
.view-tab.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px}
.game-card{background:#fff;border:1px solid var(--g200);border-radius:var(--r);overflow:hidden;cursor:pointer;position:relative;transition:transform .16s,box-shadow .16s}
.game-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.game-card.favorit{border-color:var(--amber)}
.card-cover{width:100%;aspect-ratio:3/2;background:var(--g100);border-bottom:1px solid var(--g200);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.card-cover::before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,transparent,transparent 19px,var(--g200) 19px,var(--g200) 20px),repeating-linear-gradient(90deg,transparent,transparent 19px,var(--g200) 19px,var(--g200) 20px);opacity:.6}
.card-icon{font-size:26px;color:var(--g300);position:relative;z-index:1;opacity:.7}
.card-btns{position:absolute;top:6px;right:6px;display:flex;gap:3px;z-index:2}
.card-body{padding:9px 11px 11px}
.card-title{font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.3;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-tags{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:4px}
.card-sub{font-size:11px;color:var(--g400);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-bgg{font-size:11px;font-weight:600;color:var(--amber);margin-top:3px}
.game-list{display:flex;flex-direction:column;gap:2px}
.game-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#fff;border:1px solid var(--g200);border-radius:var(--r2);cursor:pointer;transition:background .1s}
.game-row:hover{background:var(--cream)}
.game-row.favorit{border-left:3px solid var(--amber)}
.row-icon{font-size:18px;color:var(--g300);width:32px;text-align:center;flex-shrink:0}
.row-info{flex:1;min-width:0}
.row-title{font-size:13px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{font-size:11.5px;color:var(--g400);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-tags{display:flex;gap:4px;flex-shrink:0}
.row-bgg{font-size:12px;font-weight:600;color:var(--amber);flex-shrink:0}
.row-btns{display:flex;gap:3px;flex-shrink:0}
.icon-btn{width:26px;height:26px;border:1px solid var(--g200);border-radius:var(--r2);background:#fff;color:var(--g400);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s}
.icon-btn:hover{border-color:var(--amber);color:var(--amber)}
.icon-btn.fav{background:#fff7ed;border-color:var(--amber);color:var(--amber)}
.icon-btn.played{background:#f0fdf4;border-color:var(--green2);color:var(--green)}
.tag{font-size:10.5px;font-weight:500;padding:2px 7px;border-radius:10px;white-space:nowrap}
.tag-genre{background:#eff6ff;color:var(--blue)}
.tag-kind{background:#f0fdf4;color:var(--green)}
.tag-expert{background:#fdf4ff;color:#7e22ce}
.tag-party{background:#fdf2f8;color:#be185d}
.tag-erw{background:var(--g100);color:var(--g500)}
.tag-sdj{background:#fff7ed;color:var(--amber);border:1px solid #fed7aa}
.group-block{margin-bottom:22px}
.group-title{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;color:var(--ink);margin-bottom:7px;padding-bottom:5px;border-bottom:2px solid var(--amber);display:flex;align-items:baseline;gap:8px}
.group-count{font-family:'DM Sans',sans-serif;font-size:11px;color:var(--g400);font-weight:400}
.panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
.panel-overlay.open{opacity:1;pointer-events:all}
.detail-panel{position:fixed;top:0;right:-400px;width:370px;height:100vh;background:#fff;z-index:201;overflow-y:auto;transition:right .25s cubic-bezier(.4,0,.2,1);box-shadow:-6px 0 24px rgba(0,0,0,.15)}
.detail-panel.open{right:0}
.panel-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--g200)}
.panel-title{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:var(--ink);line-height:1.3;flex:1}
.panel-close{width:28px;height:28px;border:1px solid var(--g200);border-radius:var(--r2);background:#fff;color:var(--g500);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.panel-close:hover{background:var(--cream)}
.panel-body{padding:14px 18px}
.panel-actions{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.panel-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid var(--g100);font-size:13px}
.pr-label{color:var(--g400);font-weight:500;flex-shrink:0}
.pr-val{color:var(--ink2);text-align:right;word-break:break-word}
.panel-notes{margin-top:14px}
.panel-notes label{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--g400);margin-bottom:5px}
.bgg-row{display:flex;align-items:center;gap:7px}
.bgg-input{width:80px;padding:6px 9px;border:1px solid var(--g200);border-radius:var(--r2);font-family:inherit;font-size:13px;outline:none}
.bgg-input:focus{border-color:var(--amber)}
textarea{width:100%;padding:8px 10px;border:1px solid var(--g200);border-radius:var(--r2);font-family:inherit;font-size:13px;color:var(--ink);resize:vertical;outline:none}
textarea:focus{border-color:var(--amber)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:#fff;border-radius:var(--r);width:510px;max-width:calc(100vw - 32px);max-height:calc(100vh - 48px);overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;border-bottom:1px solid var(--g200)}
.modal-head h2{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:var(--ink)}
.modal-body{padding:14px 18px;display:flex;flex-direction:column;gap:11px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:600;color:var(--g500);letter-spacing:.04em}
.field input,.field select,.field textarea{padding:7px 9px;border:1px solid var(--g200);border-radius:var(--r2);font-family:inherit;font-size:13px;color:var(--ink);outline:none;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--amber)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-footer{display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--g200)}
.delete-area{flex:1}
.empty{text-align:center;padding:60px 20px;color:var(--g400)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;font-size:13px;padding:8px 18px;border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap;z-index:500}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:var(--red)}
@media(max-width:720px){.sidebar{display:none}.main{padding:12px 14px}.game-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}}
</style>
</head>
<body>

<header>
  <div class="header-brand">
    <span class="brand-icon">♟</span>
    <div class="brand-text">
      <span class="brand-title">Dieters</span>
      <span class="brand-sub">Boardgames</span>
    </div>
  </div>
  <div class="search-wrap">
    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="search" placeholder="Titel, Autor, Verlag, Serie…" oninput="applyFilters()">
  </div>
  <div class="header-right">
    <span class="stat-pill" id="stat-total">– Spiele</span>
    <button class="btn primary" onclick="openAdd()">+ Hinzufügen</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-section">
      <h4>Ansicht</h4>
      <div class="filter-group">
        <button class="filter-btn active" id="vf-alle" onclick="setViewFilter('alle',this)">Alle <span class="count" id="cnt-alle">–</span></button>
        <button class="filter-btn" id="vf-favoriten" onclick="setViewFilter('favoriten',this)">★ Favoriten <span class="count" id="cnt-fav">–</span></button>
        <button class="filter-btn" id="vf-gespielt" onclick="setViewFilter('gespielt',this)">✓ Gespielt <span class="count" id="cnt-played">–</span></button>
        <button class="filter-btn" id="vf-ungespielt" onclick="setViewFilter('ungespielt',this)">○ Ungespielt <span class="count" id="cnt-unplayed">–</span></button>
      </div>
    </div>
    <div class="sidebar-section"><h4>Typ</h4><div class="filter-group" id="typ-filters"></div></div>
    <div class="sidebar-section"><h4>Genre</h4><div class="filter-group" id="genre-filters"></div></div>
    <div class="sidebar-section"><h4>Verlag</h4><div class="filter-group" id="verlag-filters"></div></div>
    <div class="sidebar-section"><h4>Auszeichnung</h4><div class="filter-group" id="sdj-filters"></div></div>
  </aside>

  <main class="main">
    <div class="view-bar">
      <span class="view-label" id="view-label">0 Spiele</span>
      <select class="sort-select" id="sort" onchange="applyFilters()">
        <option value="az">A → Z</option><option value="za">Z → A</option>
        <option value="jahr">Jahr</option><option value="bgg">BGG-Rating</option>
        <option value="serie">Serie</option><option value="autor">Autor</option>
        <option value="verlag">Verlag</option>
      </select>
      <div class="view-tabs">
        <button class="view-tab" id="lt-list" onclick="setLayout('list',this)">☰ Liste</button>
        <button class="view-tab active" id="lt-grid" onclick="setLayout('grid',this)">⊞ Kacheln</button>
        <button class="view-tab" id="lt-group" onclick="setLayout('group',this)">≡ Serien</button>
      </div>
    </div>
    <div id="game-container"></div>
  </main>
</div>

<div class="panel-overlay" id="panel-overlay" onclick="closePanel()"></div>
<div class="detail-panel" id="detail-panel">
  <div class="panel-header">
    <div class="panel-title" id="dp-title"></div>
    <button class="panel-close" onclick="closePanel()">✕</button>
  </div>
  <div class="panel-body">
    <div class="panel-actions">
      <button class="btn" id="dp-fav-btn" onclick="toggleFavPanel()"></button>
      <button class="btn" id="dp-played-btn" onclick="togglePlayedPanel()"></button>
      <button class="btn" onclick="openEdit()">✎ Bearbeiten</button>
    </div>
    <div id="dp-rows"></div>
    <div class="panel-notes">
      <label>BGG-Rating</label>
      <div class="bgg-row">
        <input class="bgg-input" type="number" id="dp-bgg" min="1" max="10" step="0.1" placeholder="z.B. 7.8">
        <span>/ 10</span>
        <button class="btn" onclick="saveBGGNotes()">Speichern</button>
      </div>
    </div>
    <div class="panel-notes" style="margin-top:14px">
      <label>Notizen</label>
      <textarea id="dp-notes" rows="4"></textarea>
      <button class="btn" style="margin-top:8px;width:100%;justify-content:center" onclick="saveBGGNotes()">Notizen speichern</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modal-title">Spiel hinzufügen</h2>
      <button class="panel-close" onclick="closeModal(null)">✕</button>
    </div>
    <div class="modal-body">
      <div class="field"><label>Spielname *</label><input type="text" id="f-name"></div>
      <div class="field-row">
        <div class="field"><label>Verlag</label><input type="text" id="f-verlag"></div>
        <div class="field"><label>Autor</label><input type="text" id="f-autor"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Gruppe / Serie</label><input type="text" id="f-gruppe"></div>
        <div class="field"><label>Jahr</label><input type="number" id="f-jahr"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Genre</label>
          <select id="f-genre">
            <option>Familienspiel</option><option>Kennerspiel</option><option>Expertenspiel</option>
            <option>Kinderspiel</option><option>Partyspiel</option><option>Party</option>
            <option>Kartenspiel</option><option>Würfelspiel</option><option>Roll &amp; Write</option>
            <option>Deckbuilding</option><option>Escape</option><option>Detektivspiel</option>
            <option>Deduktionsspiel</option><option>Krimispiel</option><option>Zwei-Personen-Spiel</option>
            <option>Quiz</option><option>Einpersonenspiel</option>
          </select>
        </div>
        <div class="field"><label>Typ</label>
          <select id="f-typ"><option>Grundspiel</option><option>Erweiterung</option><option>Print &amp; Play</option></select>
        </div>
      </div>
      <div class="field"><label>Auszeichnung</label><input type="text" id="f-sdj"></div>
      <div class="field-row">
        <div class="field"><label>BGG-Rating</label><input type="number" id="f-bgg" min="1" max="10" step="0.1"></div>
        <div class="field"><label>Spieleranzahl</label><input type="text" id="f-spieler"></div>
      </div>
      <div class="field"><label>Notizen</label><textarea id="f-notes" rows="3"></textarea></div>
    </div>
    <div class="modal-footer">
      <div class="delete-area"><button class="btn danger" id="delete-btn" onclick="deleteGame()" style="display:none">Löschen</button></div>
      <button class="btn" onclick="closeModal(null)">Abbrechen</button>
      <button class="btn primary" id="save-btn" onclick="saveGame()">Speichern</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

// Favoriten & gespielt aus localStorage laden
const STATE_KEY = 'dieter_games_state';
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STATE_KEY)||'{}');
    games.forEach(g => {
      if (s[g.id]) {
        g.favorit    = s[g.id].favorit    || false;
        g.gespielt   = s[g.id].gespielt   || false;
        g.bgg_rating = s[g.id].bgg_rating || null;
        g.notizen    = s[g.id].notizen    || null;
      }
    });
  } catch(e) {}
}
function saveState() {
  const s = {};
  games.forEach(g => {
    if (g.favorit || g.gespielt || g.bgg_rating || g.notizen) {
      s[g.id] = { favorit: g.favorit, gespielt: g.gespielt, bgg_rating: g.bgg_rating, notizen: g.notizen };
    }
  });
  localStorage.setItem(STATE_KEY, JSON.stringify(s));
}

let layout = 'grid';
let currentId = null;
let editingId = null;
let filterView = 'alle';
let filterGenre = '';
let filterTyp = '';
let filterVerlag = '';
let filterSdj = false;
let nextId = games.length + 1;

const ICONS = ['♟','♜','♞','♛','♙','♚','🎲','🎯'];
const icon = id => ICONS[Math.abs(id) % ICONS.length];

function toast(msg, err=false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast'+(err?' error':'')+' show';
  setTimeout(()=>el.classList.remove('show'), 2500);
}

function filtered() {
  const q = (document.getElementById('search').value||'').toLowerCase().trim();
  return games.filter(g => {
    if (filterView==='favoriten'  && !g.favorit)  return false;
    if (filterView==='gespielt'   && !g.gespielt)  return false;
    if (filterView==='ungespielt' &&  g.gespielt)  return false;
    if (filterGenre  && g.genre  !==filterGenre)  return false;
    if (filterTyp    && g.typ    !==filterTyp)    return false;
    if (filterVerlag && g.verlag !==filterVerlag) return false;
    if (filterSdj    && !g.spiel_des_jahres)      return false;
    if (q && ![g.name,g.verlag,g.autor,g.gruppe].some(v=>(v||'').toLowerCase().includes(q))) return false;
    return true;
  });
}

function sorted(data) {
  const s = document.getElementById('sort').value;
  return [...data].sort((a,b)=>{
    if (s==='az')    return (a.name||'').localeCompare(b.name||'','de');
    if (s==='za')    return (b.name||'').localeCompare(a.name||'','de');
    if (s==='jahr')  return (parseInt(b.jahr)||0)-(parseInt(a.jahr)||0);
    if (s==='bgg')   return (parseFloat(b.bgg_rating)||0)-(parseFloat(a.bgg_rating)||0);
    if (s==='serie') return (a.gruppe||'zzz').localeCompare(b.gruppe||'zzz','de');
    if (s==='autor') return (a.autor||'').localeCompare(b.autor||'','de');
    if (s==='verlag')return (a.verlag||'').localeCompare(b.verlag||'','de');
    return 0;
  });
}

function setViewFilter(f,btn) {
  filterView=f;
  document.querySelectorAll('[id^="vf-"]').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function setLayout(l,btn) {
  layout=l;
  document.querySelectorAll('.view-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function applyFilters() { render(); }

function buildSidebar() {
  function countMap(key) {
    const m={};
    games.forEach(g=>{ if(g[key]) m[g[key]]=(m[g[key]]||0)+1; });
    return m;
  }
  function renderGroup(id,map,active,setter) {
    const el=document.getElementById(id);
    el.innerHTML='';
    const all=document.createElement('button');
    all.className='filter-btn'+(!active?' active':'');
    all.innerHTML=`Alle <span class="count">${games.length}</span>`;
    all.onclick=()=>{ setter(''); render(); };
    el.appendChild(all);
    Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,12).forEach(([k,v])=>{
      const b=document.createElement('button');
      b.className='filter-btn'+(active===k?' active':'');
      b.innerHTML=`${k} <span class="count">${v}</span>`;
      b.onclick=()=>{ setter(k); render(); };
      el.appendChild(b);
    });
  }
  renderGroup('genre-filters',countMap('genre'),filterGenre,v=>filterGenre=v);
  renderGroup('typ-filters',countMap('typ'),filterTyp,v=>filterTyp=v);
  renderGroup('verlag-filters',countMap('verlag'),filterVerlag,v=>filterVerlag=v);
  const sdjEl=document.getElementById('sdj-filters');
  sdjEl.innerHTML='';
  const allSdj=document.createElement('button');
  allSdj.className='filter-btn'+(!filterSdj?' active':'');
  allSdj.innerHTML=`Alle <span class="count">${games.length}</span>`;
  allSdj.onclick=()=>{ filterSdj=false; render(); };
  sdjEl.appendChild(allSdj);
  const awarded=games.filter(g=>g.spiel_des_jahres).length;
  const aBtn=document.createElement('button');
  aBtn.className='filter-btn'+(filterSdj?' active':'');
  aBtn.innerHTML=`🏆 Ausgezeichnet <span class="count">${awarded}</span>`;
  aBtn.onclick=()=>{ filterSdj=true; render(); };
  sdjEl.appendChild(aBtn);
  document.getElementById('cnt-alle').textContent=games.length;
  document.getElementById('cnt-fav').textContent=games.filter(g=>g.favorit).length;
  document.getElementById('cnt-played').textContent=games.filter(g=>g.gespielt).length;
  document.getElementById('cnt-unplayed').textContent=games.filter(g=>!g.gespielt).length;
  document.getElementById('stat-total').textContent=games.length+' Spiele';
}

function genreBadge(genre) {
  if (!genre) return '';
  let cls='tag-genre';
  if (genre.includes('Kinder')) cls='tag-kind';
  else if (genre.includes('Experten')||genre.includes('Kenner')) cls='tag-expert';
  else if (genre.includes('Party')||genre.includes('Quiz')) cls='tag-party';
  return `<span class="tag ${cls}">${genre}</span>`;
}
function typBadge(typ) {
  if (!typ||typ==='Grundspiel') return '';
  return `<span class="tag tag-erw">${typ}</span>`;
}

function cardHTML(g) {
  const bgg=g.bgg_rating?`<div class="card-bgg">★ ${parseFloat(g.bgg_rating).toFixed(1)}</div>`:'';
  return `<div class="game-card${g.favorit?' favorit':''}" onclick="openPanel(${g.id})">
    <div class="card-cover"><span class="card-icon">${icon(g.id)}</span></div>
    <div class="card-btns">
      <button class="icon-btn${g.favorit?' fav':''}" onclick="event.stopPropagation();toggleFav(${g.id})">★</button>
      <button class="icon-btn${g.gespielt?' played':''}" onclick="event.stopPropagation();togglePlayed(${g.id})">✓</button>
    </div>
    <div class="card-body">
      <div class="card-title">${g.name}</div>
      <div class="card-tags">${genreBadge(g.genre)}${typBadge(g.typ)}</div>
      <div class="card-sub">${[g.verlag,g.jahr].filter(Boolean).join(' · ')}</div>
      ${bgg}
    </div>
  </div>`;
}

function rowHTML(g) {
  const bgg=g.bgg_rating?`<span class="row-bgg">★ ${parseFloat(g.bgg_rating).toFixed(1)}</span>`:'';
  const sub=[g.verlag,g.autor?g.autor.split(',')[0].trim():'',g.gruppe,g.jahr].filter(Boolean).join(' · ');
  return `<div class="game-row${g.favorit?' favorit':''}" onclick="openPanel(${g.id})">
    <div class="row-icon">${icon(g.id)}</div>
    <div class="row-info"><div class="row-title">${g.name}</div><div class="row-sub">${sub}</div></div>
    <div class="row-tags">${genreBadge(g.genre)}${typBadge(g.typ)}</div>
    ${g.spiel_des_jahres?`<span class="tag tag-sdj" title="${g.spiel_des_jahres}">🏆</span>`:''}
    ${bgg}
    <div class="row-btns">
      <button class="icon-btn${g.favorit?' fav':''}" onclick="event.stopPropagation();toggleFav(${g.id})">★</button>
      <button class="icon-btn${g.gespielt?' played':''}" onclick="event.stopPropagation();togglePlayed(${g.id})">✓</button>
    </div>
  </div>`;
}

function render() {
  buildSidebar();
  const data=sorted(filtered());
  const el=document.getElementById('game-container');
  document.getElementById('view-label').textContent=`${data.length} Spiel${data.length!==1?'e':''}`;
  if (!data.length) { el.innerHTML='<div class="empty">Keine Spiele gefunden.</div>'; return; }
  if (layout==='list') {
    el.innerHTML=`<div class="game-list">${data.map(rowHTML).join('')}</div>`;
  } else if (layout==='grid') {
    el.innerHTML=`<div class="game-grid">${data.map(cardHTML).join('')}</div>`;
  } else {
    const groups={};
    data.forEach(g=>{ const k=g.gruppe||'__'; if(!groups[k]) groups[k]=[]; groups[k].push(g); });
    const keys=Object.keys(groups).filter(k=>k!=='__').sort((a,b)=>a.localeCompare(b,'de'));
    const einzel=groups['__']||[];
    let html='';
    keys.forEach(k=>{ html+=`<div class="group-block"><div class="group-title">${k} <span class="group-count">${groups[k].length}</span></div><div class="game-list">${groups[k].map(rowHTML).join('')}</div></div>`; });
    if (einzel.length) html+=`<div class="group-block"><div class="group-title">Einzeltitel <span class="group-count">${einzel.length}</span></div><div class="game-list">${einzel.map(rowHTML).join('')}</div></div>`;
    el.innerHTML=html;
  }
}

function openPanel(id) {
  currentId=id;
  const g=games.find(x=>x.id===id);
  if (!g) return;
  document.getElementById('dp-title').textContent=g.name||'–';
  document.getElementById('dp-fav-btn').textContent=g.favorit?'★ Favorit entfernen':'☆ Als Favorit';
  document.getElementById('dp-played-btn').textContent=g.gespielt?'✓ Als ungespielt':'○ Als gespielt';
  document.getElementById('dp-bgg').value=g.bgg_rating||'';
  document.getElementById('dp-notes').value=g.notizen||'';
  const rows=[['Verlag',g.verlag||'–'],['Autor',g.autor||'–'],['Gruppe / Serie',g.gruppe||'–'],['Jahr',g.jahr||'–'],['Genre',g.genre||'–'],['Typ',g.typ||'–'],['Auszeichnung',g.spiel_des_jahres||'–'],['Spieleranzahl',g.spieleranzahl||'–']];
  document.getElementById('dp-rows').innerHTML=rows.map(([l,v])=>`<div class="panel-row"><span class="pr-label">${l}</span><span class="pr-val">${v}</span></div>`).join('');
  document.getElementById('panel-overlay').classList.add('open');
  document.getElementById('detail-panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel-overlay').classList.remove('open');
  document.getElementById('detail-panel').classList.remove('open');
  currentId=null;
}

function toggleFavPanel() { if(currentId){toggleFav(currentId);openPanel(currentId);} }
function togglePlayedPanel() { if(currentId){togglePlayed(currentId);openPanel(currentId);} }

function toggleFav(id) {
  const g=games.find(x=>x.id===id);
  g.favorit=!g.favorit;
  saveState(); render();
  toast(g.favorit?'★ Favorit hinzugefügt':'Aus Favoriten entfernt');
}

function togglePlayed(id) {
  const g=games.find(x=>x.id===id);
  g.gespielt=!g.gespielt;
  saveState(); render();
  toast(g.gespielt?'✓ Als gespielt markiert':'Als ungespielt markiert');
}

function saveBGGNotes() {
  if(!currentId) return;
  const g=games.find(x=>x.id===currentId);
  g.bgg_rating=document.getElementById('dp-bgg').value||null;
  g.notizen=document.getElementById('dp-notes').value||null;
  saveState(); render(); toast('Gespeichert ✓');
}

  document.getElementById('f-gruppe').value=g.gruppe||'';
  document.getElementById('f-jahr').value=g.jahr||'';
  document.getElementById('f-sdj').value=g.spiel_des_jahres||'';
  document.getElementById('f-spieler').value=g.spieleranzahl||'';
  document.getElementById('f-genre').value=g.genre||'Familienspiel';
  document.getElementById('f-typ').value=g.typ||'Grundspiel';
  document.getElementById('f-bgg').value=g.bgg_rating||'';
  document.getElementById('f-notes').value=g.notizen||'';
  document.getElementById('delete-btn').style.display='';
  closePanel();
  document.getElementById('modal-overlay').classList.add('open');
}

function saveGame() {
  const name=document.getElementById('f-name').value.trim();
  if(!name){toast('Bitte Spielname eingeben',true);return;}
  if(editingId) {
    const g=games.find(x=>x.id===editingId);
    g.name=name;g.verlag=document.getElementById('f-verlag').value.trim()||null;
    g.autor=document.getElementById('f-autor').value.trim()||null;
    g.gruppe=document.getElementById('f-gruppe').value.trim()||null;
    g.jahr=document.getElementById('f-jahr').value.trim()||null;
    g.spiel_des_jahres=document.getElementById('f-sdj').value.trim()||null;
    g.spieleranzahl=document.getElementById('f-spieler').value.trim()||null;
    g.genre=document.getElementById('f-genre').value;
    g.typ=document.getElementById('f-typ').value;
    g.bgg_rating=document.getElementById('f-bgg').value||null;
    g.notizen=document.getElementById('f-notes').value||null;
    toast('Aktualisiert ✓');
  } else {
    games.push({
      id:nextId++,name,
      verlag:document.getElementById('f-verlag').value.trim()||null,
      autor:document.getElementById('f-autor').value.trim()||null,
      gruppe:document.getElementById('f-gruppe').value.trim()||null,
      jahr:document.getElementById('f-jahr').value.trim()||null,
      spiel_des_jahres:document.getElementById('f-sdj').value.trim()||null,
      spieleranzahl:document.getElementById('f-spieler').value.trim()||null,
      genre:document.getElementById('f-genre').value,
      typ:document.getElementById('f-typ').value,
      bgg_rating:document.getElementById('f-bgg').value||null,
      notizen:document.getElementById('f-notes').value||null,
      favorit:false,gespielt:false
    });
    toast('Hinzugefügt ✓');
  }
  saveState(); closeModal(null); render();
}

function deleteGame() {
  if(!editingId) return;
  if(!confirm('Spiel wirklich löschen?')) return;
  games=games.filter(x=>x.id!==editingId);
  saveState(); closeModal(null); render(); toast('Gelöscht');
}

function closeModal(e) {
  if(e&&e.target!==document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('open');
  editingId=null;
}

loadState();
render();
</script>
</body>
</html>
