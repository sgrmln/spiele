<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spielesammlung</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-icon">🎲</span>
    Spiele<em>sammlung</em>
  </div>
  <div class="search-wrap">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="search" placeholder="Titel, Verlag oder Serie suchen…" oninput="applyFilters()">
  </div>
  <div class="header-right">
    <div class="sync-status">
      <div class="sync-dot" id="sync-dot"></div>
      <span id="sync-label">Verbunden</span>
    </div>
    <span class="stat-pill" id="stat-total">– Spiele</span>
    <button class="btn primary" onclick="openAdd()">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      Hinzufügen
    </button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-section">
      <h4>Ansicht</h4>
      <div class="filter-group">
        <button class="filter-btn active" id="vf-alle" onclick="setViewFilter('alle',this)">Alle Spiele <span class="count" id="cnt-alle">–</span></button>
        <button class="filter-btn" id="vf-favoriten" onclick="setViewFilter('favoriten',this)">★ Favoriten <span class="count" id="cnt-fav">–</span></button>
        <button class="filter-btn" id="vf-gespielt" onclick="setViewFilter('gespielt',this)">✓ Gespielt <span class="count" id="cnt-played">–</span></button>
        <button class="filter-btn" id="vf-ungespielt" onclick="setViewFilter('ungespielt',this)">○ Ungespielt <span class="count" id="cnt-unplayed">–</span></button>
      </div>
    </div>
    <div class="sidebar-section">
      <h4>Typ</h4>
      <div class="filter-group" id="typ-filters"></div>
    </div>
    <div class="sidebar-section">
      <h4>Genre</h4>
      <div class="filter-group" id="genre-filters"></div>
    </div>
    <div class="sidebar-section">
      <h4>Verlag</h4>
      <div class="filter-group" id="verlag-filters"></div>
    </div>
  </aside>

  <main class="main">
    <div class="view-bar">
      <span class="view-label" id="view-label">Lädt…</span>
      <select class="sort-select" id="sort" onchange="applyFilters()">
        <option value="az">A → Z</option>
        <option value="za">Z → A</option>
        <option value="bgg">BGG-Rating</option>
        <option value="serie">Serie</option>
        <option value="verlag">Verlag</option>
        <option value="neu">Zuletzt hinzugefügt</option>
      </select>
      <div class="view-tabs">
        <button class="view-tab active" id="lt-list" onclick="setLayout('list',this)">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3" cy="6" r="1.5" fill="currentColor"/><circle cx="3" cy="12" r="1.5" fill="currentColor"/><circle cx="3" cy="18" r="1.5" fill="currentColor"/></svg>
          Liste
        </button>
        <button class="view-tab" id="lt-grid" onclick="setLayout('grid',this)">
          <svg width="13" height="13" fill="currentColor" viewBox="0 0 16 16"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
          Kacheln
        </button>
        <button class="view-tab" id="lt-group" onclick="setLayout('group',this)">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="4" rx="1"/><rect x="2" y="10" width="20" height="4" rx="1"/><rect x="2" y="17" width="20" height="4" rx="1"/></svg>
          Serien
        </button>
      </div>
    </div>
    <div id="game-container">
      <div class="loading"><div class="spinner"></div> Lade Spielesammlung…</div>
    </div>
  </main>
</div>

<!-- Detail Panel -->
<div class="panel-overlay" id="panel-overlay" onclick="closePanel()"></div>
<div class="detail-panel" id="detail-panel">
  <div class="panel-header">
    <div class="panel-title" id="dp-title"></div>
    <button class="panel-close" onclick="closePanel()">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="panel-body">
    <div class="panel-actions">
      <button class="btn" id="dp-fav-btn" onclick="toggleFavPanel()"></button>
      <button class="btn" id="dp-played-btn" onclick="togglePlayedPanel()"></button>
      <button class="btn" onclick="openEdit()">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
        Bearbeiten
      </button>
    </div>
    <div id="dp-rows"></div>
    <div class="panel-notes">
      <label>BGG-Rating</label>
      <div class="bgg-row">
        <input class="bgg-input" type="number" id="dp-bgg" min="1" max="10" step="0.1" placeholder="z.B. 7.8">
        <span style="font-size:13px;color:var(--gray-400)">/ 10</span>
        <button class="btn" style="font-size:12px" onclick="saveBGGNotes()">Speichern</button>
      </div>
    </div>
    <div class="panel-notes" style="margin-top:14px">
      <label>Notizen</label>
      <textarea id="dp-notes" placeholder="Eigene Notizen…" rows="4"></textarea>
      <button class="btn" style="margin-top:8px;width:100%;justify-content:center;font-size:12px" onclick="saveBGGNotes()">Notizen speichern</button>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modal-title">Spiel hinzufügen</h2>
      <button class="panel-close" onclick="closeModal(null)">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="field"><label>Spielname *</label><input type="text" id="f-name" placeholder="z.B. Carcassonne"></div>
      <div class="field-row">
        <div class="field"><label>Verlag</label><input type="text" id="f-verlag" placeholder="z.B. Hans im Glück"></div>
        <div class="field"><label>Serie / Gruppe</label><input type="text" id="f-serie" placeholder="z.B. Carcassonne"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Jahr</label><input type="number" id="f-jahr" placeholder="z.B. 2000"></div>
        <div class="field"><label>Spieleranzahl</label><input type="text" id="f-spieler" placeholder="z.B. 2–5"></div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Genre</label>
          <select id="f-genre">
            <option value="Familienspiel">Familienspiel</option>
            <option value="Kennerspiel">Kennerspiel</option>
            <option value="Kennerspiel / Expertenspiel">Kennerspiel / Expertenspiel</option>
            <option value="Kinderspiel">Kinderspiel</option>
            <option value="Party / Kommunikation / Quiz">Party / Quiz</option>
            <option value="Rätsel / Escape / Detektiv">Rätsel / Escape</option>
            <option value="Roll & Write / Würfelspiel">Roll & Write</option>
            <option value="Deckbuilding / Kartenspiel">Deckbuilding</option>
            <option value="Partyspiel">Partyspiel</option>
            <option value="Kartenspiel">Kartenspiel</option>
            <option value="Zweipersonenspiel">Zweipersonenspiel</option>
          </select>
        </div>
        <div class="field">
          <label>Typ</label>
          <select id="f-typ">
            <option value="Grundspiel">Grundspiel</option>
            <option value="Erweiterung/Zusatzbox">Erweiterung</option>
            <option value="Erweiterung">Erweiterung (standalone)</option>
            <option value="Kinderspiel">Kinderspiel</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>Wert (€)</label><input type="text" id="f-wert" placeholder="z.B. 20–30 €"></div>
        <div class="field"><label>BGG-Rating</label><input type="number" id="f-bgg" placeholder="z.B. 7.8" min="1" max="10" step="0.1"></div>
      </div>
      <div class="field"><label>Notizen</label><textarea id="f-notes" rows="3" placeholder="Eigene Notizen…"></textarea></div>
    </div>
    <div class="modal-footer">
      <div class="delete-area"><button class="btn danger" id="delete-btn" onclick="deleteGame()" style="display:none">Löschen</button></div>
      <button class="btn" onclick="closeModal(null)">Abbrechen</button>
      <button class="btn primary" id="save-btn" onclick="saveGame()">Speichern</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'SUPABASE_URL_PLACEHOLDER';
const SUPABASE_ANON_KEY = 'SUPABASE_ANON_KEY_PLACEHOLDER';
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
